name: Build with release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ./ui
      - run: npm run lint
        working-directory: ./ui
      - run: npm test
        working-directory: ./ui
      - run: npm run build
        working-directory: ./ui
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ui
          path: ui/dist
          if-no-files-found: error

  build-binaries:
    runs-on: ubuntu-latest
    needs: build-ui
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ui
          path: backend/embed/ui
      - name: Test backend
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: ./backend
        run: go test ./...
      - name: Build binary
        working-directory: ./backend
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "als-${GOOS}-${GOARCH}" .
      - uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: backend/als-${{ matrix.goos }}-${{ matrix.goarch }}
          asset_name: als-${{ matrix.goos }}-${{ matrix.goarch }}
          tag: ${{ github.ref }}
          overwrite: true
          make_latest: legacy
