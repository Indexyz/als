name: Build with release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ./ui
      - run: npm run lint
        working-directory: ./ui
      - run: npm test
        working-directory: ./ui
      - run: npm run build
        working-directory: ./ui
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ui
          path: ui/dist
          if-no-files-found: error

  build-binaries:
    runs-on: ${{ matrix.runner }}
    needs: build-ui
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cgo: '0'
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cgo: '0'
          # NextTrace's Darwin trace package links the system libpcap through
          # CGO. Build on each macOS architecture; never fall back to a CLI.
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cgo: '1'
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ui
          path: backend/embed/ui
      - name: Test backend
        working-directory: ./backend
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Build binary
        working-directory: ./backend
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "als-${GOOS}-${GOARCH}" .
      - uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: backend/als-${{ matrix.goos }}-${{ matrix.goarch }}
          asset_name: als-${{ matrix.goos }}-${{ matrix.goarch }}
          tag: ${{ inputs.tag || github.ref }}
          overwrite: true
          make_latest: legacy
